name: Deploy CISO Assistant to Netlify

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'Nom du site Netlify (ex: ciso)'
        required: false
        default: 'ciso'
      backend_url:
        description: 'URL de votre API CISO Assistant distante'
        required: false
        default: 'https://api.ciso.example.com/api'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build Frontend with Netlify Adapter
        working-directory: frontend
        env:
          NETLIFY: 'true'
          ADAPTER: 'netlify'
          PUBLIC_BACKEND_API_URL: ${{ inputs.backend_url || vars.PUBLIC_BACKEND_API_URL || 'https://api.ciso.example.com/api' }}
          PUBLIC_BACKEND_API_EXPOSED_URL: ${{ inputs.backend_url || vars.PUBLIC_BACKEND_API_EXPOSED_URL || 'https://api.ciso.example.com/api' }}
        run: pnpm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SITE_NAME: ${{ inputs.site_name || vars.NETLIFY_SITE_NAME || 'ciso' }}
        run: |
          if [ -n "$NETLIFY_SITE_ID" ]; then
            npx netlify-cli deploy --prod --dir=frontend/.svelte-kit/netlify --functions=frontend/.netlify/functions-internal --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          else
            npx netlify-cli deploy --prod --dir=frontend/.svelte-kit/netlify --functions=frontend/.netlify/functions-internal --site="$SITE_NAME" --auth="$NETLIFY_AUTH_TOKEN"
          fi
