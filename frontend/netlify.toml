# ==============================================================================
# Netlify Configuration for Frontend Subdirectory
# ==============================================================================

[build]
  command = "pnpm run build"
  publish = ".svelte-kit/netlify"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=3072"
  PNPM_FLAGS = "--frozen-lockfile=false"
  NETLIFY = "true"
  ADAPTER = "netlify"
  ROLLDOWN_WORKER_THREADS = "2"
  ROLLDOWN_MAX_BLOCKING_THREADS = "2"
  RAYON_NUM_THREADS = "2"

[functions]
  node_bundler = "esbuild"
