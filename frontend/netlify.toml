# ==============================================================================
# Netlify Configuration for Frontend Subdirectory
# ==============================================================================

[build]
  command = "pnpm run build"
  publish = ".svelte-kit/netlify"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  PNPM_FLAGS = "--frozen-lockfile=false"
  NETLIFY = "true"
  ADAPTER = "netlify"

[functions]
  node_bundler = "esbuild"
